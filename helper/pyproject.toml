[project]
name = "bioseasy-pair-helper"
version = "1.0.0"
description = "Self-contained desktop app for macOS, Windows and Linux: pairs an iPhone/iPad over USB and hands the record to bioseasy."
requires-python = ">=3.12"
dependencies = [
    "pymobiledevice3==11.12.5",
    "certifi>=2025.1.31",
]

[dependency-groups]
build = [
    "pyinstaller>=6.11",
]

[tool.uv]
package = false

[tool.uv.workspace]
exclude = ["*"]
